name: Build INK AND NINE

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4

      - name: Unpack project
        run: unzip -q Ink_and_Nine_Android_Project.zip -d project

      - uses: gradle/gradle-build-action@v3
        with:
          gradle-version: '8.9'
          arguments: -p project/InkAndNineAndroid :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: INK-AND-NINE-APK
          path: project/InkAndNineAndroid/app/build/outputs/apk/debug/app-debug.apk
